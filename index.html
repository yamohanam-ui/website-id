<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Informasi ID | Digital Profile</title>

    <style>
        /* =========================
           1. PENGATURAN DASAR
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyan: #48e5ff;
            --blue: #5484ff;
            --purple: #a855f7;
            --white: #f8fafc;
            --muted: #a5b4cc;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--white);
            background: #080d1c;
            overflow-x: hidden;
        }

        /* =========================
           2. ANIMASI BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(84, 132, 255, 0.19),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(168, 85, 247, 0.17),
                    transparent 35%
                ),
                #080d1c;
        }

        .orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-one {
            background: #2563eb;
            top: -100px;
            left: -100px;
        }

        .orb-two {
            background: #9333ea;
            right: -100px;
            bottom: -100px;
            animation-delay: -4s;
        }

        .orb-three {
            background: #0891b2;
            width: 200px;
            height: 200px;
            top: 45%;
            left: 45%;
            animation-delay: -7s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(60px, -50px) scale(1.2);
            }
        }

        /* =========================
           3. HEADER
        ========================= */

        header {
            width: 100%;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            animation: slideDown 0.8s ease both;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--cyan);
        }

        .header-badge {
            border: 1px solid rgba(72, 229, 255, 0.3);
            color: var(--cyan);
            padding: 9px 14px;
            border-radius: 30px;
            font-size: 12px;
            background: rgba(72, 229, 255, 0.06);
        }

        /* =========================
           4. KONTEN UTAMA
        ========================= */

        main {
            width: 100%;
            min-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px 50px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeUp 0.8s ease 0.15s both;
        }

        .intro-label {
            color: var(--cyan);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .intro h1 {
            font-size: clamp(28px, 5vw, 46px);
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .intro h1 span {
            background: linear-gradient(
                90deg,
                var(--cyan),
                #a78bfa,
                var(--cyan)
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 4s linear infinite;
        }

        @keyframes gradientMove {
            to {
                background-position: 200% center;
            }
        }

        .intro p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================
           5. KARTU INFORMASI
        ========================= */

        .id-card {
            position: relative;
            width: 100%;
            max-width: 460px;
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.13);

            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.10),
                rgba(255, 255, 255, 0.025)
            );

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            overflow: hidden;
            animation: fadeUp 0.9s ease 0.3s both;
            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }

        .id-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.06),
                transparent
            );
            transform: skewX(-20deg);
            animation: shine 7s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0%, 60% {
                left: -120%;
            }

            85%, 100% {
                left: 150%;
            }
        }

        .id-card:hover {
            transform: translateY(-7px);
            border-color: rgba(72, 229, 255, 0.45);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(72, 229, 255, 0.08);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .card-title {
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .id-number {
            font-size: 12px;
            color: var(--cyan);
            padding: 7px 10px;
            border-radius: 8px;
            background: rgba(72, 229, 255, 0.08);
        }

        /* =========================
           6. IDENTITAS
        ========================= */

        .profile {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 30px;
        }

        .avatar {
            flex-shrink: 0;
            width: 78px;
            height: 78px;
            border-radius: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
            font-weight: bold;
            color: white;

            background: linear-gradient(
                135deg,
                #2563eb,
                #9333ea
            );

            box-shadow: 0 8px 30px rgba(84, 132, 255, 0.25);
        }

        .profile-info h2 {
            font-size: 22px;
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .profile-info p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* =========================
           7. DETAIL INFORMASI
        ========================= */

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 22px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 15px;
        }

        .detail-label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #86efac;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 12px #4ade80;
            animation: pulse 1.8s
